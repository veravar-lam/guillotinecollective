<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painting Fish · Guillotine Collective</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .painting-fish-page {
        margin: 0;
        background: #fff;
        color: #111;
      }

      .painting-fish-main {
        width: 100%;
      }

      .painting-fish-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .painting-fish-audio {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-top: 24px;
      }
    </style>
  </head>
  <body class="painting-fish-page">
    <main class="painting-fish-main" aria-label="Painting Fish">
      <img
        class="painting-fish-image"
        src="images/projects/painting-fish/ultimate.jpeg"
        alt="Painting Fish"
      />
      <audio
        class="painting-fish-audio"
        controls
        preload="metadata"
      >
        <source
          src="images/projects/painting-fish/painting-fish-audio.mp4"
          type="audio/mp4"
        />
        Your browser does not support the audio element.
      </audio>
    </main>
  </body>
</html>
