<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Dinner · Guillotine Collective</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
      }

      .dinner-page {
        background: #000;
      }

      .dinner-main {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: #000;
      }

      .dinner-video {
        display: block;
        width: auto;
        height: 100vh;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        background: #000;
      }
    </style>
  </head>
  <body class="dinner-page">
    <main class="dinner-main" aria-label="The Dinner">
      <video
        class="dinner-video"
        controls
        playsinline
        preload="metadata"
      >
        <source src="images/projects/dinner/dinner.mp4" type="video/mp4" />
      </video>
    </main>
  </body>
</html>
