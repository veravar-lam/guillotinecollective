<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects · Guillotine Collective</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }

      body.projects-page {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #e8e8e8;
        background-image: url("images/projects/project-titles/help.jpg");
        background-size: cover;
        background-position: center 40%;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .projects-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: clamp(28px, 4vh, 48px);
        padding:
          clamp(50px, 21vh, 160px)
          clamp(16px, 4vw, 40px)
          clamp(24px, 5vh, 48px)
          clamp(20px, 7vw, 72px);
        box-sizing: border-box;
        max-width: 100%;
      }

      .project-link {
        display: block;
        width: fit-content;
        max-width: 100%;
        text-decoration: none;
        line-height: 1.15;
        color: inherit;
      }

      /* Typography fallbacks — shown only if the title image fails to load */
      .project-title {
        display: none;
        white-space: nowrap;
      }

      .project-link--loosers .project-title {
        font-family: "Apple Chancery", "Chancery", cursive;
        font-size: 18pt;
        color: #000;
      }

      .project-link--guilty-pleasures .project-title {
        font-family: Impact, "Arial Black", sans-serif;
        font-size: 18pt;
        color: #000;
      }

      .project-link--asmr .project-title {
        font-family: "Arial Rounded MT Bold", "Arial Rounded MT", "Nunito", sans-serif;
        font-size: 18pt;
        color: #000;
      }

      .project-link--people-pleaser .project-title {
        font-family: "Airco Std", Arial, sans-serif;
        font-size: 18pt;
        font-style: italic;
        font-weight: 700;
        color: #fff;
        -webkit-text-stroke: 1px #000;
        paint-order: stroke fill;
      }

      .project-link--babyproof .project-title {
        font-family: "Balloon Drop Shadow D", "Comic Sans MS", cursive;
        font-size: 27pt;
        color: #000;
      }

      .project-link--painting-fish .project-title {
        font-family: "Minion Pro", Minion, Georgia, serif;
        font-size: 23pt;
        color: #fff;
        -webkit-text-stroke: 1px #000;
        paint-order: stroke fill;
      }

      .project-link--money .project-title {
        font-family: "8", Impact, "Arial Black", sans-serif;
        font-size: 18pt;
        color: #000;
      }

      .project-link--dinner .project-title {
        font-family: "Minion Pro", Minion, Georgia, serif;
        font-size: 18pt;
        color: #000;
      }

      .project-title-img {
        display: block;
        width: auto;
        height: auto;
        max-width: min(90vw, 680px);
      }

      .project-link--loosers .project-title-img,
      .project-link--guilty-pleasures .project-title-img,
      .project-link--asmr .project-title-img,
      .project-link--people-pleaser .project-title-img,
      .project-link--money .project-title-img,
      .project-link--dinner .project-title-img {
        height: 40px;
      }

      .project-link--babyproof .project-title-img {
        height: 60px;
      }

      .project-link--painting-fish .project-title-img {
        height: 50px;
      }

      @media (max-width: 768px) {
        body.projects-page {
          background-attachment: scroll;
        }
      }

      @media (max-width: 480px) {
        .projects-list {
          padding-top: clamp(32px, 18vh, 100px);
          padding-left: clamp(16px, 6vw, 32px);
          gap: clamp(24px, 3.5vh, 40px);
        }

        .project-title-img {
          max-width: 88vw;
        }
      }
    </style>
  </head>
  <body class="projects-page">
    <main class="projects-list" role="main" aria-label="Project list">
      <a class="project-link project-link--loosers" href="Loosers.html">
        <img class="project-title-img" src="images/projects/project-titles/loosers.png" alt="LOOSERS / SA7 el Noom" />
        <span class="project-title">LOOSERS / SA7 el Noom</span>
      </a>
      <a class="project-link project-link--guilty-pleasures" href="guilty-pleasures.html">
        <img class="project-title-img" src="images/projects/project-titles/guilty-pleasures.png" alt="Guilty Pleasures" />
        <span class="project-title">Guilty Pleasures</span>
      </a>
      <a class="project-link project-link--asmr" href="deportation-asmr.html">
        <img class="project-title-img" src="images/projects/project-titles/asmr.png" alt="DEPORTATION ASMR" />
        <span class="project-title">DEPORTATION ASMR</span>
      </a>
      <a class="project-link project-link--babyproof" href="babyproof.html">
        <img class="project-title-img" src="images/projects/project-titles/baybyproof.png" alt="BAYBYPROOF" />
        <span class="project-title">BAYBYPROOF</span>
      </a>
      <a class="project-link project-link--people-pleaser" href="PeoplePleaser.html">
        <img class="project-title-img" src="images/projects/project-titles/people-pleaser.png" alt="PEOPLE PLEASER" />
        <span class="project-title">PEOPLE PLEASER</span>
      </a>
      <a class="project-link project-link--painting-fish" href="PaintingFish.html">
        <img class="project-title-img" src="images/projects/project-titles/painting-fish.png" alt="Painting Fish" />
        <span class="project-title">Painting Fish</span>
      </a>
      <a class="project-link project-link--money" href="money.html">
        <img class="project-title-img" src="images/projects/project-titles/money.png" alt="MONEY$" />
        <span class="project-title">MONEY$</span>
      </a>
      <a class="project-link project-link--dinner" href="dinner.html">
        <img class="project-title-img" src="images/projects/project-titles/dinner.png" alt="The Dinner" />
        <span class="project-title">The Dinner</span>
      </a>
    </main>
  </body>
</html>
