<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects · Guillotine Collective</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body.projects-page {
        background-color: #d8d8d8;
        overflow: auto;
      }

      .projects-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .projects-photo {
        position: relative;
        container-type: size;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        line-height: 0;
      }

      .projects-bg {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        width: auto;
        height: auto;
      }

      .projects-list {
        position: absolute;
        left: 8cqw;
        top: 30cqh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4cqh;
        margin: 0;
        padding: 0;
      }

      .project-link {
        display: block;
        width: fit-content;
        text-decoration: none;
        line-height: 0;
        flex-shrink: 0;
      }

      .project-title-img {
        display: block;
        width: auto;
        height: auto;
        max-width: 72cqw;
      }

      .project-link--loosers .project-title-img,
      .project-link--guilty-pleasures .project-title-img,
      .project-link--asmr .project-title-img,
      .project-link--people-pleaser .project-title-img,
      .project-link--money .project-title-img,
      .project-link--dinner .project-title-img {
        height: 4.8cqh;
      }

      .project-link--babyproof .project-title-img {
        height: 6.8cqh;
      }

      .project-link--painting-fish .project-title-img {
        height: 5.6cqh;
      }

      /* Fallback when container queries are unavailable */
      @supports not (width: 1cqw) {
        .projects-list {
          left: 8%;
          top: 30%;
          gap: 4vh;
        }

        .project-link--loosers .project-title-img,
        .project-link--guilty-pleasures .project-title-img,
        .project-link--asmr .project-title-img,
        .project-link--people-pleaser .project-title-img,
        .project-link--money .project-title-img,
        .project-link--dinner .project-title-img {
          height: 4.8vh;
        }

        .project-link--babyproof .project-title-img {
          height: 6.8vh;
        }

        .project-link--painting-fish .project-title-img {
          height: 5.6vh;
        }

        .project-title-img {
          max-width: 72vw;
        }
      }
    </style>
  </head>
  <body class="projects-page">
    <div class="projects-frame">
      <div class="projects-photo">
        <img
          class="projects-bg"
          src="images/projects/project-titles/help.jpg"
          alt=""
        />
        <main class="projects-list" role="main" aria-label="Project list">
          <a class="project-link project-link--loosers" href="Loosers.html">
            <img class="project-title-img" src="images/projects/project-titles/loosers.png" alt="LOOSERS / SA7 el Noom" />
          </a>
          <a class="project-link project-link--guilty-pleasures" href="guilty-pleasures.html">
            <img class="project-title-img" src="images/projects/project-titles/guilty-pleasures.png" alt="Guilty Pleasures" />
          </a>
          <a class="project-link project-link--asmr" href="asmr.html">
            <img class="project-title-img" src="images/projects/project-titles/asmr.png" alt="DEPORTATION ASMR" />
          </a>
          <a class="project-link project-link--babyproof" href="baybyproof.html">
            <img class="project-title-img" src="images/projects/project-titles/baybyproof.png" alt="BAYBYPROOF" />
          </a>
          <a class="project-link project-link--people-pleaser" href="PeoplePleaser.html">
            <img class="project-title-img" src="images/projects/project-titles/people-pleaser.png" alt="PEOPLE PLEASER" />
          </a>
          <a class="project-link project-link--painting-fish" href="PaintingFish.html">
            <img class="project-title-img" src="images/projects/project-titles/painting-fish.png" alt="Painting Fish" />
          </a>
          <a class="project-link project-link--money" href="money.html">
            <img class="project-title-img" src="images/projects/project-titles/money.png" alt="MONEY$" />
          </a>
          <a class="project-link project-link--dinner" href="dinner.html">
            <img class="project-title-img" src="images/projects/project-titles/dinner.png" alt="The Dinner" />
          </a>
        </main>
      </div>
    </div>
  </body>
</html>
